[package]
name = "wall"
version = "1.2.0"
edition = "2021"

[[bin]]
name = "wall"
path = "src/main.rs"

[dependencies]
rand              = "0.8"
image             = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
fast_image_resize = "4"
dirs              = "5"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
ureq              = { version = "2", features = ["json"] }
toml              = "0.8"
clap              = { version = "4", features = ["derive"] }

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = true
opt-level     = 3
