[package]
name = "wall"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wall"
path = "main.rs"

[dependencies]
rand        = "0.8"
image       = "0.25"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
fast_image_resize = "4"
walkdir     = "2"
dirs        = "5"

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = true
opt-level     = 3
